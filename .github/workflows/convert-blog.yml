name: Convert Blog

# Triggered by the web frontend via the GitHub Actions API.
# Blog mode: produces QMD + images only — no LaTeX, no PDF, runs in ~2 min.
on:
  workflow_dispatch:
    inputs:
      google_doc_url:
        description: "Google Docs share URL"
        required: true
      title:
        description: "Title"
        required: true
      authors:
        description: "Authors (comma-separated)"
        required: false
        default: ""
      date:
        description: "Date (YYYY-MM-DD)"
        required: false
        default: ""
      categories:
        description: "Categories (comma-separated)"
        required: false
        default: ""
      slug:
        description: "Output filename stem (no spaces or extension)"
        required: true
        default: "post"
      run_token:
        description: "Unique token generated by the frontend for polling (do not edit)"
        required: true

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run blog conversion
        env:
          DOC_URL:    ${{ inputs.google_doc_url }}
          TITLE:      ${{ inputs.title }}
          AUTHORS:    ${{ inputs.authors }}
          DATE:       ${{ inputs.date }}
          CATEGORIES: ${{ inputs.categories }}
          SLUG:       ${{ inputs.slug }}
        run: |
          python app/cli.py \
            --mode   blog       \
            --url    "$DOC_URL"  \
            --title  "$TITLE"   \
            --authors "$AUTHORS" \
            --date   "$DATE"    \
            --categories "$CATEGORIES" \
            --slug   "$SLUG"    \
            --output /tmp/output.zip

      - name: Publish output to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          RUN_TOKEN=$(echo "${{ inputs.run_token }}" | tr -dc 'a-zA-Z0-9-')

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/ghpages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/ghpages
            touch /tmp/ghpages/.nojekyll
            cd /tmp/ghpages
            git add .nojekyll
            git commit -m "chore: initialize gh-pages"
            git push origin gh-pages
            cd -
          fi

          mkdir -p /tmp/ghpages/outputs/${RUN_TOKEN}
          cp /tmp/output.zip /tmp/ghpages/outputs/${RUN_TOKEN}/document.zip

          cd /tmp/ghpages
          git add outputs/${RUN_TOKEN}/document.zip
          git commit -m "output: ${RUN_TOKEN}"
          git push origin HEAD:gh-pages
